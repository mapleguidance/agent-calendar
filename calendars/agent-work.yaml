  - summary: "onlyspx notebooks: stitching and run-output fixes"
    description: |
      Fixed the intraday-range history pull to use the point-in-time
      front-month contract for each date (plain splice, no
      back-adjustment), giving full sessions across the roll instead of
      thin back-month bars. Also added the RTH open and volume print to
      the run output so publishing is self-contained. Repo and live
      notebook copies synced; the next scheduled run is the live proof.
    begin: 2026-10-12 07:00:00
    duration: { hours: 1 }

