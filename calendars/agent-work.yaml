    duration: { minutes: 15 }
    repeat:
      interval: { days: 7 }
      until: 2028-01-01 00:00:00

  - summary: "onlyspx notebooks: stitching and run-output fixes"
    description: |
      Fixed the intraday-range history pull to use the point-in-time
      front-month contract for each date (plain splice, no
      back-adjustment), giving full sessions across the roll instead of
      thin back-month bars. Also added the RTH open and volume print to
      the run output so publishing is self-contained. Repo and live
      notebook copies synced; the next scheduled run is the live proof.
    begin: 2026-10-12 07:00:00
    duration: { hours: 1 }

  - summary: "MapleScholar: Search Console investigation and indexing run"
    description: |
      Morning investigation completed with no new Ads gaps; sessions and
      Search Console state checked. Indexing run: five requests
      submitted and accepted; one long-standing paper page is still not
      indexed after repeated requests, and one chat URL failed
      transiently again and is to be retried the next day.
    begin: 2026-10-12 06:30:00
    duration: { hours: 1 }

  - summary: "Monday Top 10 Rotation review: no papers selected"
    description: |
      Weekly rotation review selected no papers for the third
      consecutive week, with all candidates rejected on page-health
      grounds. A spot check suggests the health check uses stale data.
      The notification email could not be sent because the agent mailbox
      is disabled. Decision needed: fix the health check or suspend the
      review while the rotation campaigns remain paused. Nothing was
      applied to Ads.
    begin: 2026-10-12 07:15:00
    duration: { minutes: 30 }

